<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening App...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading-state">
            <div class="spinner"></div>
            <h2>Redirecting you to the app...</h2>
            <p>Please wait a moment.</p>
        </div>
        
        <div id="error-state" style="display: none;">
            <h2>Invalid Link Structure</h2>
            <p>Missing required parameters inside the QR code data.</p>
        </div>

        <p style="margin-top: 30px; font-size: 14px; color: #666;">
            If nothing happens, <a id="manual-link" href="#">click here to proceed</a> manually.
        </p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        // URLSearchParams.get automatically decodes %26 back to &
        const rawDeepLink = urlParams.get('deeplink'); 
        const rawFallback = urlParams.get('fallback');
    
        if (rawDeepLink && rawFallback) {
            // 1. Extract Package Name from fallback
            const pkgMatch = rawFallback.match(/[?&]id=([^&#]+)/);
            const packageName = pkgMatch ? pkgMatch[1] : "";
    
            // 2. Split Scheme from Path
            // Input: ir.codecomp.dangodong://join-period?id=123...
            const parts = rawDeepLink.split("://");
            const scheme = parts[0];
            const pathAndQuery = parts[1];
    
            // 3. Build Intent
            // S.browser_fallback_url must be the FULL encoded fallback
            const intentUrl = `intent://${pathAndQuery}#Intent;scheme=${scheme};package=${packageName};S.browser_fallback_url=${encodeURIComponent(rawFallback)};end`;
    
            // Redirect
            window.location.href = intentUrl;
            
            // Manual link update
            document.getElementById('manual-link').href = intentUrl;
        }
    </script>
</body>
</html>
