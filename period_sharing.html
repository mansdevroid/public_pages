<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening App...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading-state">
            <div class="spinner"></div>
            <h2>Redirecting you to the app...</h2>
            <p>Please wait a moment.</p>
        </div>
        
        <div id="error-state" style="display: none;">
            <h2>Invalid Link Structure</h2>
            <p>Missing required parameters inside the QR code data.</p>
        </div>

        <p style="margin-top: 30px; font-size: 14px; color: #666;">
            If nothing happens, <a id="manual-link" href="#">click here to proceed</a> manually.
        </p>
    </div>

    <script>
        // 1. Extract parameters safely out of the current browser URL
        const urlParams = new URLSearchParams(window.location.search);
        const rawDeepLink = urlParams.get('deeplink'); // Expected: "myapp://profile/123"
        const rawFallback = urlParams.get('fallback'); // Expected: Play store link

        if (!rawDeepLink || !rawFallback) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
        } else {
            // 2. Parse out the scheme and path/query properties out of the dynamic deeplink
            // Example: myapp://profile/123 -> Scheme: "myapp", Intent Path: "profile/123"
            const urlObj = new URL(rawDeepLink.replace("://", "://placeholder-host/"));
            const appScheme = rawDeepLink.split("://")[0];
            
            // Clean up path data to extract everything after the custom scheme divider
            const intentPathAndQuery = rawDeepLink.substring(rawDeepLink.indexOf("://") + 3);

            // 3. Extract your package name out of the fallback Play Store link automatically
            let packageName = "";
            const pkgMatch = rawFallback.match(/[?&]id=([^&#]+)/);
            if (pkgMatch) {
                packageName = pkgMatch[1];
            }

            // 4. Construct the Android Intent URL with the Dynamic Web Fallback embedded
            // Format constraint: intent://[path]#Intent;scheme=[scheme];package=[package];S.browser_fallback_url=[fallback];end
            const intentUrl = `intent://${intentPathAndQuery}#Intent;scheme=${appScheme};package=${packageName};S.browser_fallback_url=${encodeURIComponent(rawFallback)};end`;

            // Bind fallback click target just in case automatic window execution fails
            const manualAnchor = document.getElementById('manual-link');
            manualAnchor.href = intentUrl;

            // 5. Fire off the intent immediately
            window.location.href = intentUrl;
        }
    </script>
</body>
</html>
