<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DangoDong | Period Sharing</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f9fa; }
        .card { text-align: center; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 85%; max-width: 400px; }
        .btn { display: block; width: 100%; background: #222; color: white; padding: 18px; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 18px; border: none; cursor: pointer; }
        .btn:active { background: #444; }
        h2 { margin-bottom: 10px; color: #111; }
        p { color: #666; margin-bottom: 30px; font-size: 16px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Invite Received!</h2>
    <p>Tap below to open this period in your DangoDong app.</p>
    
    <button id="main-action" class="btn">Open App</button>
</div>

<script>
    // 1. Get params (no automatic execution)
    const urlParams = new URLSearchParams(window.location.search);
    const deepLink = urlParams.get('deeplink'); 
    const playStore = urlParams.get('fallback');

    const actionBtn = document.getElementById('main-action');

    actionBtn.addEventListener('click', () => {
        if (!deepLink || !playStore) {
            alert("Invalid link parameters.");
            return;
        }

        // 2. Track if the user leaves the page
        let pageHidden = false;
        const onVisibilityChange = () => {
            if (document.hidden) pageHidden = true;
        };
        document.addEventListener("visibilitychange", onVisibilityChange);

        // 3. Try to open the app
        window.location.href = deepLink;

        // 4. Fallback Logic:
        // Wait 1.5 seconds. If the page is still visible, the app didn't open.
        setTimeout(() => {
            document.removeEventListener("visibilitychange", onVisibilityChange);
            
            if (!pageHidden) {
                // App not found, redirect to Play Store
                window.location.href = playStore;
            }
        }, 1500);
    });
</script>

</body>
</html>
