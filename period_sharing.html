<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DangoDong | Join Period</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f7f6; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 90%; }
        .btn { display: inline-block; background: #007bff; color: white; padding: 16px 32px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; border: none; }
        .btn:active { transform: scale(0.98); }
        h2 { margin-top: 0; color: #333; }
        p { color: #666; margin-bottom: 25px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Join the Period</h2>
    <p>Tap the button below to open the invite in your app.</p>
    
    <button id="open-button" class="btn">Open DangoDong</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawDeepLink = urlParams.get('deeplink'); 
    const rawFallback = urlParams.get('fallback');

    const openButton = document.getElementById('open-button');

    openButton.addEventListener('click', () => {
        e.preventDefault();

        if (!deepLink || !playStore) return;
    
        // 1. Extract the host path (e.g., "join-period")
        const parts = deepLink.split("://");
        const scheme = parts[0]; // "ir.codecomp.dangodong"
        const hostOnly = parts[1].split("?")[0]; // "join-period"
    
        // 2. Extract the package name safely from the Play Store URL
        const pkgMatch = playStore.match(/[?&]id=([^&#]+)/);
        const packageName = pkgMatch ? pkgMatch[1] : "ir.codecomp.dangodong";
    
        // 3. THE FIXED INTENT SYNTAX:
        // - Front of URI: intent://join-period
        // - Scheme block: scheme=ir.codecomp.dangodong
        // - Extra payload: S.full_link hides the complex & symbols safely inside a string parameter
        const intentUrl = `intent://${hostOnly}#Intent;scheme=${scheme};package=${packageName};S.full_link=${encodeURIComponent(deepLink)};S.browser_fallback_url=${encodeURIComponent(playStore)};end`;
    
        let pageHidden = false;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) pageHidden = true;
        });
    
        // Launch the app
        window.location.href = intentUrl;
    
        // Fallback tracker
        setTimeout(() => {
            if (!pageHidden) {
                window.location.href = playStore;
            }
        }, 2000);
    });
</script>

</body>
</html>
