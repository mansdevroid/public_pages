<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening App...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading-state">
            <div class="spinner"></div>
            <h2>Redirecting you to the app...</h2>
            <p>Please wait a moment.</p>
        </div>
        
        <div id="error-state" style="display: none;">
            <h2>Invalid Link Structure</h2>
            <p>Missing required parameters inside the QR code data.</p>
        </div>

        <p style="margin-top: 30px; font-size: 14px; color: #666;">
            If nothing happens, <a id="manual-link" href="#">click here to proceed</a> manually.
        </p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const rawDeepLink = urlParams.get('deeplink'); 
        const rawFallback = urlParams.get('fallback');
    
        if (rawDeepLink && rawFallback) {
            // 1. Cleanly parse the deep link
            // From: ir.codecomp.dangodong://join-period?id=...
            const protocolParts = rawDeepLink.split("://");
            const scheme = protocolParts[0];
            const path = protocolParts[1];
    
            // 2. Identify Package
            const pkgMatch = rawFallback.match(/[?&]id=([^&#]+)/);
            const packageName = pkgMatch ? pkgMatch[1] : "ir.codecomp.dangodong";
    
            // 3. Construct the Intent URL
            // We use S.browser_fallback_url but we also add a 'package' flag
            // and ensure the path is correctly placed.
            const intentUrl = `intent://${path}#Intent;scheme=${scheme};package=${packageName};S.browser_fallback_url=${encodeURIComponent(rawFallback)};end`;
    
            // Update the manual button immediately
            const btn = document.getElementById('manual-link');
            btn.href = intentUrl;
    
            // 4. Attempt Redirect with a slight delay
            // This sometimes bypasses Chrome's immediate "auto-fallback" logic
            setTimeout(() => {
                window.location.href = intentUrl;
            }, 500);
    
            // 5. If they are still here after 3 seconds, the auto-redirect definitely failed
            // Show the button prominently because Chrome blocked the auto-launch.
            setTimeout(() => {
                document.getElementById('loading-state').style.display = 'none';
                const errorDiv = document.getElementById('error-state');
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = `
                    <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                        <h2 style="color: #333;">Open in DangoDong</h2>
                        <p>Tap below to continue to your shared period.</p>
                        <a href="${intentUrl}" style="display: inline-block; background: #28a745; color: white; padding: 15px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 18px;">Open App</a>
                    </div>
                `;
            }, 2500);
        }
    </script>
</body>
</html>
