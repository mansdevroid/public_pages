<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DangoDong | Join Period</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f7f6; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 90%; }
        .btn { display: inline-block; background: #007bff; color: white; padding: 16px 32px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; border: none; }
        .btn:active { transform: scale(0.98); }
        h2 { margin-top: 0; color: #333; }
        p { color: #666; margin-bottom: 25px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Join the Period</h2>
    <p>Tap the button below to open the invite in your app.</p>
    
    <button id="open-button" class="btn">Open DangoDong</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const rawDeepLink = urlParams.get('deeplink'); 
    const rawFallback = urlParams.get('fallback');

    const openButton = document.getElementById('open-button');

    openButton.addEventListener('click', () => {
        e.preventDefault();

        if (!deepLink || !playStore) return;
    
        // 1. Hardcode your app identifiers to ensure no parsing mistakes
        const scheme = "ir.codecomp.dangodong";
        const host = "join-period";
        const packageName = "ir.codecomp.dangodong";
    
        // 2. THE CORRECT CHROME INTENT SYNTAX:
        // Structure: intent://[host]#Intent;scheme=[scheme];package=[package];...;end;
        // We pass the full link inside S.full_link to safeguard the query variables from Android 9's parser.
        const intentUrl = `intent://${host}#Intent;scheme=${scheme};package=${packageName};S.full_link=${encodeURIComponent(deepLink)};S.browser_fallback_url=${encodeURIComponent(playStore)};end`;
    
        let pageHidden = false;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) pageHidden = true;
        });
    
        // Fire the intent window launch
        window.location.href = intentUrl;
    
        // Fallback tracker to Play Store if app isn't installed
        setTimeout(() => {
            if (!pageHidden) {
                window.location.href = playStore;
            }
        }, 2000);
    });
</script>

</body>
</html>
